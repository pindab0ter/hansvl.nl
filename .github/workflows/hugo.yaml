name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v4
        id: pages

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - run: git lfs checkout

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.2"
          extended: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: |
          hugo \
            --gc \
            --minify \
            --baseURL ${{ steps.pages.outputs.base_url }}
        env:
          # Hugo sandboxes its PostCSS node process with Node's permission model;
          # --allow-addons lets it load Tailwind v4's lightningcss native addon.
          NODE_OPTIONS: --allow-addons

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
